# /etc/nginx/sites-available/iptds.conf
# One domain serves both the React app and the API, so no CORS is needed.
# Replace iptds.example.com with your domain, then:
#   sudo ln -s /etc/nginx/sites-available/iptds.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d iptds.example.com      # adds the HTTPS server block + redirect

upstream iptds_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name iptds.example.com;

    root /var/www/iptds/frontend/dist;
    index index.html;

    client_max_body_size 5m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Django: the API and Django's own admin site.
    location /api/ {
        proxy_pass http://iptds_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /django-admin/ {
        proxy_pass http://iptds_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin CSS/JS (python manage.py collectstatic).
    location /static/ {
        alias /var/www/iptds/backend/investment_pipeline/staticfiles/;
        expires 30d;
        access_log off;
    }

    # (Nginx drops server-level add_header lines in blocks that set their own, so they are repeated.)
    # Vite's hashed build files never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        access_log off;
        try_files $uri =404;
    }

    # Everything else is the React app; unknown paths fall back to index.html
    # so routes like /portfolios/12 or /admin/registry work on reload.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
